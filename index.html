<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E5EEF8">
<title>קוד שדה תעופה לנציגויות ישראל בעולם</title>
<meta name="description" content="מאגר ערים וקודי שדות תעופה של נציגויות ישראל בעולם – משרד החוץ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Overpass+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: sky-band header with title + live stats → floating flight-search card (sticky) with region chips → results board: table on desktop, cards on mobile; IATA codes as LTR boarding-pass chips */
:root{
  --bg:#F2F6FA;          /* page ground, pale blue-grey */
  --sky:#E5EEF8;         /* header band */
  --dot:#CBDAEA;         /* map-grid dots, route line */
  --surface:#FFFFFF;
  --navy:#0A2647;        /* titles, city names, codes */
  --ink:#24364D;         /* body text */
  --muted:#5A6B82;
  --faint:#8797AC;
  --line:#D9E3EE;
  --line-soft:#E9EFF6;
  --hover:#F6F9FD;
  --blue:#1660D6;        /* aviation blue: active, focus */
  --blue-ink:#0E4FB8;
  --blue-soft:#E8F0FD;
  --blue-soft-2:#D8E6FC;
  --teal:#0C9A96;        /* soft turquoise: success, route */
  --teal-soft:#E1F4F3;
  --amber:#B86E00;
  --amber-soft:#FFF4E0;
  --hl:#FFE7A0;          /* search highlight */

  --font-ui:"Heebo","Assistant","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --font-code:"Overpass Mono","SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;

  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --shadow-1:0 1px 2px rgba(10,38,71,.05),0 1px 1px rgba(10,38,71,.03);
  --shadow-2:0 14px 34px -16px rgba(10,38,71,.22),0 3px 8px -2px rgba(10,38,71,.06);
  --stick-top:calc(env(safe-area-inset-top,0px) + 10px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:180px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.app{min-height:100%}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Header ---------- */
.hero{background:var(--sky);position:relative;overflow:hidden;border-bottom:1px solid #DCE7F3}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:18px 18px;opacity:.55;
  -webkit-mask-image:linear-gradient(to left,transparent 25%,#000 85%);mask-image:linear-gradient(to left,transparent 25%,#000 85%)}
.hero-inner{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 32px;padding-block:28px 74px}
.brand{display:flex;align-items:flex-start;gap:14px;min-width:0}
.brand-mark{width:50px;height:50px;border-radius:15px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px -6px rgba(22,96,214,.55)}
.brand-mark .ic{width:26px;height:26px;stroke-width:1.8}
h1{margin:0;font-weight:800;font-size:clamp(1.6rem,1.15rem + 2.1vw,2.45rem);line-height:1.12;color:var(--navy);letter-spacing:-.01em;text-wrap:balance}
.sub{text-wrap:balance;margin:6px 0 0;font-size:clamp(.98rem,.92rem + .3vw,1.12rem);font-weight:500;color:var(--muted)}
.updated{margin:10px 0 0;display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--faint)}
.updated .ic{width:15px;height:15px}
.updated b{font-family:var(--font-code);font-weight:600;color:var(--muted);letter-spacing:.02em}

.stats{display:grid;grid-template-columns:repeat(3,auto);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-1)}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 20px;min-width:96px}
.stat + .stat{border-inline-start:1px solid var(--line-soft)}
.stat-n{font-family:var(--font-code);font-weight:700;font-size:1.65rem;line-height:1.1;color:var(--navy);font-variant-numeric:tabular-nums}
.stat-l{display:flex;align-items:center;gap:5px;font-size:.84rem;font-weight:500;color:var(--muted)}
.stat-l .ic{width:15px;height:15px;color:var(--teal)}

.route{position:absolute;top:14px;left:max(16px,env(safe-area-inset-left,0px));width:330px;height:92px;color:var(--dot);pointer-events:none}
.route text{font-family:var(--font-code);font-size:11px;font-weight:700;fill:var(--faint);letter-spacing:.08em}

/* ---------- Sticky search ---------- */
.controls{position:sticky;top:var(--stick-top);z-index:30;margin-top:-50px}
.controls::before{content:"";position:absolute;inset:-12px 0 -10px;background:var(--bg);opacity:0;transition:opacity .18s;box-shadow:0 8px 14px -14px rgba(10,38,71,.35)}
.controls.stuck::before{opacity:1}
.search-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:14px}
.search{position:relative;display:block}
.search .s-ico{position:absolute;inset-inline-start:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--blue);pointer-events:none}
.search input{width:100%;height:60px;border:1.5px solid var(--line);border-radius:14px;background:#F7FAFD;color:var(--navy);
  font:600 1.1875rem/1 var(--font-ui);padding-inline:54px 52px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--faint);font-weight:400}
.search.has-value input{padding-inline-end:56px}
.search input:focus{border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 4px var(--blue-soft)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.kbd{position:absolute;inset-inline-end:16px;top:50%;transform:translateY(-50%);font:600 .8rem/1 var(--font-code);color:var(--faint);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:4px 7px;background:var(--surface);pointer-events:none}
.search input:focus ~ .kbd,.search.has-value .kbd{display:none}
@media (pointer:coarse){.kbd{display:none}}
.clear{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:var(--line-soft);color:var(--muted);display:grid;place-items:center}
.clear:hover{background:var(--blue-soft-2);color:var(--navy)}
.clear .ic{width:18px;height:18px;stroke-width:2.2}

.chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-block:2px;
  -webkit-mask-image:linear-gradient(to left,transparent 0,#000 28px);mask-image:linear-gradient(to left,transparent 0,#000 28px)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:42px;padding-inline:14px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:.95rem;font-weight:600;color:var(--ink);white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:#B9CDE8;background:var(--hover)}
.chip .n{font:700 .78rem/1 var(--font-code);min-width:26px;padding:4px 6px;border-radius:999px;background:var(--line-soft);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.chip .ic{width:17px;height:17px;color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip[aria-pressed="true"] .n{background:rgba(255,255,255,.22);color:#fff}
.chip[aria-pressed="true"] .ic{color:#fff}
.chip.zero:not([aria-pressed="true"]){color:var(--faint)}
.chip.zero:not([aria-pressed="true"]) .n{opacity:.6}
@media (min-width:860px){.chips{flex-wrap:wrap;gap:6px;overflow:visible;-webkit-mask-image:none;mask-image:none}.chip{height:40px;padding-inline:12px 8px;font-size:.9rem;gap:7px}}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin:20px 0 12px}
.summary{margin:0;font-size:.98rem;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.summary b{color:var(--navy);font-weight:700;font-variant-numeric:tabular-nums}
.summary .q{background:var(--blue-soft);color:var(--navy);font-weight:600;padding:1px 8px;border-radius:6px;unicode-bidi:isolate}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--blue);font-weight:600;font-size:.95rem;text-decoration:underline;text-decoration-color:var(--blue-soft-2);text-underline-offset:4px}
.linkbtn:hover{text-decoration-color:var(--blue)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;align-items:center;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seg-l{font-size:.84rem;color:var(--faint);padding-inline:8px 4px}
.seg button{height:34px;padding-inline:12px;border:0;border-radius:9px;background:none;font-size:.9rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue-ink)}
.ghost{display:inline-flex;align-items:center;gap:6px;height:40px;padding-inline:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:.9rem;font-weight:600;color:var(--ink)}
.ghost:hover{border-color:#B9CDE8;background:var(--hover)}
.ghost .ic{width:16px;height:16px;color:var(--muted)}

/* ---------- Results ---------- */
.results.anim{animation:fadeUp .2s ease-out}
@keyframes fadeUp{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
.cols{display:none}
.groups{display:grid;gap:14px}
.code{display:inline-flex;align-items:center;gap:7px;height:42px;padding-inline:12px 10px;border:1px solid transparent;border-radius:10px;background:var(--blue-soft);color:var(--navy);
  font:700 1.2rem/1 var(--font-code);letter-spacing:.07em;transition:background .15s,border-color .15s,transform .1s}
.code .ic{width:16px;height:16px;color:var(--blue);stroke-width:2}
.code:hover{background:var(--blue-soft-2);border-color:#B3CAF2}
.code:active{transform:scale(.97)}
.code.copied{background:var(--teal-soft);border-color:#A9DEDB}
.code.copied .ic{color:var(--teal)}
.codes{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}
.sep{color:var(--faint);font:500 1rem/1 var(--font-code)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.tag{display:inline-block;font-size:.76rem;font-weight:600;line-height:1.35;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:2px 9px}

/* Mobile first: cards */
.list{display:grid;gap:8px;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"city codes" "country codes";column-gap:12px;row-gap:3px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 12px 12px 14px;box-shadow:var(--shadow-1)}
.c-city{grid-area:city;font-size:1.2rem;font-weight:700;color:var(--navy);line-height:1.25;min-width:0}
.c-country{grid-area:country;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:.95rem;color:var(--muted);min-width:0}
.c-country .pin{width:15px;height:15px;color:var(--faint);margin-inline-end:-4px}
.c-codes{grid-area:codes;justify-self:end}
.c-region{display:none}
.group-h{margin:0;font:inherit}
.g-head{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:12px 2px 8px;text-align:start}
.g-ico{width:32px;height:32px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.g-ico .ic{width:18px;height:18px}
.g-name{font-size:1.12rem;font-weight:800;color:var(--navy)}
.g-meta{font-size:.86rem;color:var(--muted);font-weight:500}
.g-chev{margin-inline-start:auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);flex:none;transition:transform .2s}
.g-chev .ic{width:16px;height:16px}
.is-collapsed .g-chev{transform:rotate(90deg)}
.g-head:hover .g-chev{border-color:#B9CDE8;color:var(--navy)}

/* Desktop: table */
@media (min-width:760px){
  .board{--cols:minmax(0,1.15fr) minmax(0,1.15fr) minmax(0,1.1fr)}
  .board.with-region{--cols:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.05fr)}
  .cols{display:grid;grid-template-columns:var(--cols);gap:16px;padding:0 21px 8px;font-size:.84rem;font-weight:600;color:var(--faint)}
  .cols span{display:flex;align-items:center;gap:6px}
  .cols .ic{width:15px;height:15px}
  .sheet,.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden}
  .list{gap:0}
  .row{grid-template-columns:var(--cols);grid-template-areas:none;gap:16px;border:0;border-radius:0;box-shadow:none;padding:9px 20px;min-height:60px;border-top:1px solid var(--line-soft);transition:background .12s}
  .sheet .row:first-child{border-top:0}
  .row:hover{background:var(--hover)}
  .c-country,.c-city,.c-codes{grid-area:auto}
  .c-country{font-size:1rem;color:var(--ink);font-weight:500}
  .c-country .pin,.m-only{display:none}
  .c-city{font-size:1.06rem}
  .c-codes{justify-self:start}
  .c-region{display:block}
  .code{height:38px;font-size:1.06rem;padding-inline:11px 9px}
  .g-head{padding:14px 20px;gap:12px}
  .g-head:hover{background:var(--hover)}
  .g-chev{border:0;background:none}
  .group:not(.is-collapsed) .g-head{border-bottom:1px solid var(--line)}
  .list .row:first-child{border-top:0}
}

/* ---------- Empty state ---------- */
.empty{text-align:center;background:var(--surface);border:1px dashed #C6D5E6;border-radius:var(--r-lg);padding:40px 20px 36px;margin-top:8px}
.empty-ico{width:68px;height:68px;margin:0 auto 14px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.empty-ico .ic{width:32px;height:32px;stroke-width:1.6}
.empty h2{margin:0 0 6px;font-size:1.25rem;font-weight:800;color:var(--navy)}
.empty p{margin:0 auto;max-width:44ch;color:var(--muted)}
.empty p .q{background:var(--blue-soft);color:var(--navy);font-weight:600;padding:1px 8px;border-radius:6px;unicode-bidi:isolate}
.empty p code{font-family:var(--font-code);font-weight:700;color:var(--navy)}
.empty-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.primary{display:inline-flex;align-items:center;gap:7px;height:44px;padding-inline:18px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:.95rem}
.primary:hover{background:var(--blue-ink)}
.primary .ic{width:17px;height:17px}

/* ---------- Footer & toast ---------- */
.foot{margin-top:36px;border-top:1px solid var(--line);padding-block:20px 32px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem;color:var(--faint)}
.foot b{font-family:var(--font-code);font-weight:600;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:50;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);background:var(--surface);color:var(--navy);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-2);
  padding:11px 16px 11px 14px;font-weight:600;font-size:.95rem;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .t-ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);flex:none}
.toast .t-ico .ic{width:16px;height:16px;stroke-width:2.4}
.toast.err .t-ico{background:var(--amber-soft);color:var(--amber)}
.toast .t-code{font-family:var(--font-code);font-weight:700;letter-spacing:.06em;background:var(--blue-soft);padding:2px 7px;border-radius:6px;-webkit-user-select:all;user-select:all}

@media (max-width:899px){.route{display:none}}
@media (max-width:620px){
  .hero-inner{padding-block:20px 70px;gap:16px}
  .brand-mark{width:44px;height:44px;border-radius:13px}
  .brand-mark .ic{width:23px;height:23px}
  .stats{width:100%;grid-template-columns:repeat(3,1fr)}
  .stat{padding:9px 12px;min-width:0}
  .stat-n{font-size:1.4rem}
  .search-card{padding:10px;border-radius:16px}
  .search input{height:56px;font-size:1.125rem;padding-inline:44px 14px}
  .search input::placeholder{font-size:.9rem}
  .search.has-value input{padding-inline-end:54px}
  .search .s-ico{inset-inline-start:13px;width:20px;height:20px}
  .toolbar{margin-top:16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== 2026 LIGHT TRAVEL DESK REDESIGN ===== */
:root {--bg:#f7faff;--sky:#edf6fe;--navy:#143655;--ink:#2d4960;--muted:#667e93;--faint:#8ca2b5;--line:#e1ebf4;--line-soft:#edf2f7;--blue:#1768ba;--blue-ink:#13589c;--blue-soft:#eaf4fe;--blue-soft-2:#dbeefa;--teal:#158d91;--teal-soft:#e5f6f3;--r-lg:22px;--shadow-2:0 14px 40px rgba(42,91,133,.09),0 2px 9px rgba(42,91,133,.04)}
body {background:linear-gradient(180deg,#f0f7fe 0,#f7faff 320px,#f9fbfe 100%)}
.hero {background:linear-gradient(115deg,#f4faff,#eaf5fd);border-bottom:1px solid #dfebf5;min-height:290px}
.hero::before {opacity:.17;-webkit-mask-image:none;mask-image:none}
.hero-inner {min-height:290px;align-items:flex-start;padding-block:44px 100px;gap:15px;position:relative}
.brand {position:relative;z-index:2;max-width:620px}
.brand-mark{background:#fff;color:var(--blue);border:1px solid #d7e8f6;box-shadow:0 5px 20px #bcd8ea55}
h1{max-width:580px;font-size:clamp(1.7rem,1.25rem + 1.9vw,2.35rem);line-height:1.28}
.sub{font-weight:400;color:#688096}
.updated {margin-top:18px;color:#8198ab}
.world-art{position:absolute;width:min(48%,460px);height:auto;left:3px;top:5px;opacity:.92;pointer-events:none;filter:drop-shadow(0 6px 10px #cee2f355)}
.world-art svg{width:100%;height:auto;display:block}
.map-caption{position:absolute;bottom:3px;left:16px;color:#809ab2;font:700 10px/1.2 var(--font-code);letter-spacing:.17em}
.map-caption-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#16a5a2;vertical-align:middle}
.stats{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:41px;z-index:3;border-radius:16px;box-shadow:0 6px 25px rgba(35,87,130,.07)}
.stat{padding:10px 24px;min-width:112px}
.stat-n{font-size:1.43rem;color:#1768ba}
.controls{margin-top:-35px}
.search-card{padding:14px 16px 15px;border:1px solid #e0ebf5;border-radius:22px;box-shadow:0 13px 45px rgba(26,76,112,.09),0 2px 6px rgba(26,76,112,.04)}
.search input{height:64px;background:#f8fbff;border-color:#dbe7f2;font-size:1.14rem;border-radius:15px}
.search input:focus{box-shadow:0 0 0 4px #e4f2ff}
.chips{margin-top:14px;gap:9px}
.chip{background:#f7fafe;border-color:#e2ecf5;height:39px;font-size:.87rem}
.chip[aria-pressed=true]{background:#1768ba;border-color:#1768ba;box-shadow:0 3px 12px #1768ba26}
.toolbar{margin-top:28px}
.group,.sheet{border-radius:18px!important;box-shadow:0 2px 14px rgba(25,66,103,.035)}
.group .g-head{background:#fdfefe}
.g-ico{background:#ebf5fc;border:1px solid #dfedf9}

var RECORDS = [];
REGIONS.forEach(function (r) {
  (RAW[r.id] || []).forEach(function (row) {
    var codes = row[2].split("/").map(function (x) { return x.trim(); }).filter(Boolean);
    RECORDS.push({
      region: r.id,
      country: row[0],
      city: row[1],
      codes: codes,
      nCountry: normalize(row[0]),
      nCity: normalize(row[1]),
      nCodes: codes.map(function (c) { return c.toLowerCase(); })
    });
  });
});

function sortRecords(list, by) {
  return list.slice().sort(function (a, b) {
    return by === "city"
      ? (cmp(a.city, b.city) || cmp(a.country, b.country))
      : (cmp(a.country, b.country) || cmp(a.city, b.city));
  });
}

/* התאמה: מחזיר null אם אין התאמה, אחרת טווחי הדגשה לכל שדה */
function matchRecord(rec, nq) {
  if (!nq) return { country: null, city: null, codes: [] };
  var hit = false, res = { country: null, city: null, codes: [] };
  var i = rec.nCountry.s.indexOf(nq);
  if (i > -1) { hit = true; res.country = [rec.nCountry.map[i], rec.nCountry.map[i + nq.length - 1] + 1]; }
  i = rec.nCity.s.indexOf(nq);
  if (i > -1) { hit = true; res.city = [rec.nCity.map[i], rec.nCity.map[i + nq.length - 1] + 1]; }
  rec.nCodes.forEach(function (c, k) {
    if (c.indexOf(nq) === 0) { hit = true; res.codes[k] = [0, nq.length]; }
  });
  return hit ? res : null;
}

function search(query, region, sortBy) {
  var nq = normalize(query || "").s;
  var out = [];
  RECORDS.forEach(function (rec) {
    if (region && region !== "all" && rec.region !== region) return;
    var m = matchRecord(rec, nq);
    if (m) out.push({ rec: rec, m: m });
  });
  var sorted = sortRecords(out.map(function (x) { return x.rec; }), sortBy);
  var byRec = new Map(out.map(function (x) { return [x.rec, x.m]; }));
  return sorted.map(function (rec) { return { rec: rec, m: byRec.get(rec) }; });
}

  var state = { q: "", region: "all", sort: "country", collapsed: new Set() };
  var $ = function (id) { return document.getElementById(id); };
  var input = $("q"), clearBtn = $("clear"), searchBox = $("search-box"), chipsEl = $("chips"),
      controls = $("controls"), toolbar = $("toolbar"), summary = $("summary"), board = $("board"),
      cols = $("cols"), results = $("results"), empty = $("empty"), toggleAll = $("toggle-all"),
      resetBtn = $("reset"), toast = $("toast");

  var REGION_BY_ID = {};
  REGIONS.forEach(function (r) { REGION_BY_ID[r.id] = r; });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function hl(text, range) {
    if (!range) return esc(text);
    return esc(text.slice(0, range[0])) + "<mark>" + esc(text.slice(range[0], range[1])) + "</mark>" + esc(text.slice(range[1]));
  }
  function icon(id) { return '<svg class="ic"><use href="#i-' + id + '"/></svg>'; }
  function citiesText(n) { return n === 1 ? "עיר אחת" : n + " ערים"; }
  function countriesText(n) { return n === 1 ? "מדינה אחת" : n + " מדינות"; }
  function uniqCountries(list) { var s = new Set(); list.forEach(function (r) { s.add(r.country); }); return s.size; }

  /* ---- stats (computed from data) ---- */
  $("st-cities").textContent = RECORDS.length;
  $("st-countries").textContent = uniqCountries(RECORDS);
  $("st-regions").textContent = REGIONS.length;
  $("src-date").textContent = SOURCE_DATE;
  $("foot-date").textContent = SOURCE_DATE;
  $("foot-count").textContent = citiesText(RECORDS.length) + " · " + countriesText(uniqCountries(RECORDS)) + " · " + REGIONS.length + " אזורים";

  /* ---- region chips ---- */
  var chipHTML = '<button type="button" class="chip" data-region="all" aria-pressed="true">' + icon("globe") + '<span>כל האזורים</span><span class="n"></span></button>';
  REGIONS.forEach(function (r) {
    chipHTML += '<button type="button" class="chip" data-region="' + r.id + '" aria-pressed="false"><span>' + esc(r.name) + '</span><span class="n"></span></button>';
  });
  chipsEl.innerHTML = chipHTML;
  var chips = Array.prototype.slice.call(chipsEl.querySelectorAll(".chip"));

  /* ---- rendering ---- */
  function rowHTML(rec, m, showRegion) {
    var reg = REGION_BY_ID[rec.region];
    var codes = rec.codes.map(function (c, k) {
      return '<button type="button" class="code" data-code="' + esc(c) + '" aria-label="העתקת הקוד ' + esc(c) + '" title="העתקה ללוח">' +
        '<span class="code-txt">' + hl(c, m.codes[k]) + '</span>' + icon("copy") + '</button>';
    }).join('<span class="sep" aria-hidden="true">/</span>');
    return '<div class="row" role="listitem">' +
      '<div class="c-country">' + icon("pin").replace('class="ic"', 'class="ic pin"') + '<span>' + hl(rec.country, m.country) + '</span>' +
        (showRegion ? '<span class="tag m-only">' + esc(reg.name) + '</span>' : '') + '</div>' +
      '<div class="c-city">' + hl(rec.city, m.city) + '</div>' +
      '<div class="c-codes"><div class="codes" dir="ltr">' + codes + '</div></div>' +
      (showRegion ? '<div class="c-region"><span class="tag">' + esc(reg.name) + '</span></div>' : '') +
    '</div>';
  }

  function render(opts) {
    opts = opts || {};
    var nq = normalize(state.q).s;
    var qActive = nq.length > 0;
    var res = search(state.q, state.region, state.sort);
    var grouped = !qActive && state.region === "all";
    var showRegion = qActive && state.region === "all";

    /* chip counts reflect the current search */
    var counts = { all: 0 };
    var pool = qActive ? search(state.q, "all", state.sort) : RECORDS.map(function (r) { return { rec: r }; });
    pool.forEach(function (x) { counts.all++; counts[x.rec.region] = (counts[x.rec.region] || 0) + 1; });
    chips.forEach(function (c) {
      var id = c.getAttribute("data-region"), n = counts[id] || 0;
      c.setAttribute("aria-pressed", id === state.region ? "true" : "false");
      c.querySelector(".n").textContent = n;
      c.classList.toggle("zero", n === 0);
    });

    /* summary */
    var reg = REGION_BY_ID[state.region];
    var html;
    if (qActive) {
      html = (res.length === 1 ? 'נמצאה <b>עיר אחת</b>' : 'נמצאו <b>' + res.length + '</b> ערים') +
        ' עבור <bdi class="q">' + esc(state.q.trim()) + '</bdi>' + (reg ? ' ' + reg.inName : '');
    } else if (reg) {
      html = '<b>' + res.length + '</b> ערים ' + reg.inName;
    } else {
      html = '<b>' + res.length + '</b> ערים ב־' + REGIONS.length + ' אזורים';
    }
    if (qActive || reg) html += '<span aria-hidden="true">·</span><button type="button" class="linkbtn" data-action="show-all">הצג את כל הערים</button>';
    summary.innerHTML = html;

    /* toolbar buttons */
    resetBtn.hidden = !(state.region !== "all" || state.sort !== "country");
    toggleAll.hidden = !grouped;
    updateToggleAll();
    Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-sort") === state.sort ? "true" : "false");
    });

    /* columns header (desktop) */
    board.classList.toggle("with-region", showRegion);
    cols.innerHTML = '<span>' + icon("globe") + 'מדינה</span><span>' + icon("pin") + 'עיר</span><span>' + icon("plane") + 'קוד שדה תעופה</span>' +
      (showRegion ? '<span>' + icon("map") + 'אזור</span>' : '');

    /* body */
    if (!res.length) {
      board.hidden = true;
      empty.hidden = false;
      $("empty-text").innerHTML = 'אין התאמה ל־<bdi class="q">' + esc(state.q.trim()) + '</bdi>' + (reg ? ' ' + reg.inName : '') +
        '. נסו שם עיר, שם מדינה או קוד שדה בן שלוש אותיות, למשל <code dir="ltr">JFK</code>.';
      $("empty-all-regions").hidden = !reg || (counts.all === 0);
    } else {
      board.hidden = false;
      empty.hidden = true;
      var out = "";
      if (grouped) {
        out += '<div class="groups">';
        REGIONS.forEach(function (r) {
          var items = res.filter(function (x) { return x.rec.region === r.id; });
          if (!items.length) return;
          var closed = state.collapsed.has(r.id);
          out += '<section class="group' + (closed ? ' is-collapsed' : '') + '" data-region="' + r.id + '">' +
            '<h2 class="group-h"><button type="button" class="g-head" data-toggle="' + r.id + '" aria-expanded="' + (!closed) + '" aria-controls="g-' + r.id + '">' +
              '<span class="g-ico">' + icon("globe") + '</span>' +
              '<span class="g-name">' + esc(r.name) + '</span>' +
              '<span class="g-meta">' + citiesText(items.length) + ' · ' + countriesText(uniqCountries(items.map(function (x) { return x.rec; }))) + '</span>' +
              '<span class="g-chev">' + icon("chev") + '</span>' +
            '</button></h2>' +
            '<div class="list" role="list" id="g-' + r.id + '"' + (closed ? ' hidden' : '') + '>' +
              items.map(function (x) { return rowHTML(x.rec, x.m, false); }).join("") +
            '</div></section>';
        });
        out += '</div>';
      } else {
        out = '<div class="sheet"><div class="list" role="list">' + res.map(function (x) { return rowHTML(x.rec, x.m, showRegion); }).join("") + '</div></div>';
      }
      results.innerHTML = out;
    }

    if (!opts.noAnim) {
      var target = res.length ? results : empty;
      target.classList.remove("anim"); void target.offsetWidth; target.classList.add("anim");
    }
    updateStuck();
    if (opts.keepInView) keepInView(opts.keepInView === "smooth");
  }

  function updateToggleAll() {
    var any = state.collapsed.size > 0;
    toggleAll.querySelector("span").textContent = any ? "פתח הכול" : "סגור הכול";
    toggleAll.querySelector("use").setAttribute("href", any ? "#i-unfold" : "#i-fold");
  }

  function toggleGroup(id) {
    var sec = results.querySelector('.group[data-region="' + id + '"]');
    if (!sec) return;
    var closed = !state.collapsed.has(id);
    if (closed) state.collapsed.add(id); else state.collapsed.delete(id);
    sec.classList.toggle("is-collapsed", closed);
    sec.querySelector(".g-head").setAttribute("aria-expanded", String(!closed));
    sec.querySelector(".list").hidden = closed;
    updateToggleAll();
  }

  /* ---- sticky state & keeping results in view ---- */
  function updateStuck() {
    var top = parseFloat(getComputedStyle(controls).top) || 0;
    controls.classList.toggle("stuck", controls.getBoundingClientRect().top <= top + 0.5 && window.scrollY > 0);
  }
  function keepInView(smooth) {
    if (!controls.classList.contains("stuck")) return;
    var limit = controls.getBoundingClientRect().bottom + 8;
    var top = toolbar.getBoundingClientRect().top;
    if (top < limit) window.scrollTo({ top: window.scrollY + top - limit, behavior: smooth ? "smooth" : "auto" });
  }
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () { ticking = false; updateStuck(); });
  }, { passive: true });
  window.addEventListener("resize", updateStuck);

  /* ---- copy ---- */
  var toastTimer;
  function showToast(html, isErr) {
    toast.innerHTML = '<span class="t-ico">' + icon(isErr ? "x" : "check") + '</span><span>' + html + '</span>';
    toast.classList.toggle("err", !!isErr);
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, isErr ? 5000 : 1800);
  }
  function legacyCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none";
      document.body.appendChild(ta);
      ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }
  function copyCode(btn) {
    var code = btn.getAttribute("data-code");
    var done = function (ok) {
      if (ok) {
        btn.classList.add("copied");
        btn.querySelector("use").setAttribute("href", "#i-check");
        setTimeout(function () { btn.classList.remove("copied"); var u = btn.querySelector("use"); if (u) u.setAttribute("href", "#i-copy"); }, 1400);
        showToast('הקוד הועתק <span class="t-code" dir="ltr">' + esc(code) + '</span>');
      } else {
        showToast('הדפדפן לא מאפשר העתקה אוטומטית. סמנו את הקוד והעתיקו ידנית: <span class="t-code" dir="ltr">' + esc(code) + '</span>', true);
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(function () { done(true); }, function () { done(legacyCopy(code)); });
    } else {
      done(legacyCopy(code));
    }
  }

  /* ---- actions ---- */
  function showAll() {
    state.q = ""; input.value = ""; state.region = "all"; state.collapsed.clear();
    syncClear(); render({ keepInView: "smooth" });
  }
  function syncClear() {
    var has = input.value.length > 0;
    clearBtn.hidden = !has;
    searchBox.classList.toggle("has-value", has);
  }

  input.addEventListener("input", function () { state.q = input.value; syncClear(); render({ keepInView: true }); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && input.value) { e.preventDefault(); input.value = ""; state.q = ""; syncClear(); render(); }
    if (e.key === "Enter") { e.preventDefault(); if (window.matchMedia("(pointer:coarse)").matches) input.blur(); }
  });
  clearBtn.addEventListener("click", function () { input.value = ""; state.q = ""; syncClear(); render(); input.focus(); });

  chipsEl.addEventListener("click", function (e) {
    var c = e.target.closest(".chip"); if (!c) return;
    state.region = c.getAttribute("data-region");
    render({ keepInView: "smooth" });
    try { c.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" }); } catch (err) {}
  });
  document.querySelector(".seg").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-sort]"); if (!b) return;
    state.sort = b.getAttribute("data-sort"); render({ noAnim: false });
  });
  toggleAll.addEventListener("click", function () {
    if (state.collapsed.size) state.collapsed.clear(); else REGIONS.forEach(function (r) { state.collapsed.add(r.id); });
    render({ noAnim: true, keepInView: "smooth" });
  });
  resetBtn.addEventListener("click", function () { state.sort = "country"; showAll(); });
  summary.addEventListener("click", function (e) { if (e.target.closest('[data-action="show-all"]')) showAll(); });
  $("empty-show-all").addEventListener("click", showAll);
  $("empty-all-regions").addEventListener("click", function () { state.region = "all"; render(); });

  results.addEventListener("click", function (e) {
    var b = e.target.closest(".code"); if (b) { copyCode(b); return; }
    var t = e.target.closest("[data-toggle]"); if (t) toggleGroup(t.getAttribute("data-toggle"));
  });

  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (e.key === "/" && tag !== "input" && tag !== "textarea" && !e.metaKey && !e.ctrlKey) { e.preventDefault(); input.focus(); input.select(); }
  });

  render({ noAnim: true });
  if (window.matchMedia && window.matchMedia("(pointer:fine)").matches) { try { input.focus({ preventScroll: true }); } catch (e) {} }
})();
</script>

</body>
</html>
